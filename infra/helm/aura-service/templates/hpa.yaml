{{- $min := int .Values.autoscaling.minReplicas -}}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "aura-service.name" . }}
  labels:
    {{- include "aura-service.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "aura-service.name" . }}
  minReplicas: {{ $min }}
  maxReplicas: {{ max $min (int .Values.autoscaling.maxReplicas) }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.autoscaling.targetCPUUtilizationPercentage }}
