events { worker_connections 1024; }

http {
  upstream auth_service      { server auth-service:3000; }
  upstream chat_service      { server chat-service:3000; }
  upstream memory_service    { server memory-service:3000; }
  upstream companion_service { server companion-service:3000; }
  upstream analytics_service { server analytics-service:3000; }
  upstream ai_service        { server ai-service:3000; }

  server {
    listen 8001;

    # ── Auth ──────────────────────────────────────────────────────────────
    location /api/auth/ {
      proxy_pass http://auth_service/api/auth/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    # ── Chat (HTTP) ───────────────────────────────────────────────────────
    location /api/chat/ {
      proxy_pass http://chat_service/api/chat/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    # ── WebSocket ─────────────────────────────────────────────────────────
    location /socket.io/ {
      proxy_pass http://chat_service;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_cache_bypass $http_upgrade;
    }

    # ── Memory ────────────────────────────────────────────────────────────
    location /api/memory/ {
      proxy_pass http://memory_service/api/memory/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    # ── Companion ─────────────────────────────────────────────────────────
    location /api/companion/ {
      proxy_pass http://companion_service/api/companion/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    # ── Analytics ─────────────────────────────────────────────────────────
    location /api/analytics/ {
      proxy_pass http://analytics_service/api/analytics/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    # ── AI health (internal) ──────────────────────────────────────────────
    location /api/ai/health {
      proxy_pass http://ai_service/health;
      proxy_set_header Host $host;
    }

    # ── Gateway health ────────────────────────────────────────────────────
    location /health {
      return 200 '{"status":"ok","service":"api-gateway"}';
      add_header Content-Type application/json;
    }
  }
}
